name: SafeBase CI/CD

on:
  push:
    branches: [ "main" ]
    # Une release se fait en poussant un tag : git tag v1.0.0 && git push origin v1.0.0
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# Un nouveau push sur la même branche annule le run précédent devenu obsolète
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jeton GitHub en lecture seule par défaut ; les droits en plus sont donnés job par job
permissions:
  contents: read

# Les actions sont épinglées par SHA de commit (le commentaire donne la version) :
# un tag comme "v7" peut être déplacé vers du code malveillant, un SHA non.
# Dependabot (.github/dependabot.yml) met ces SHA à jour.

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Base vide pour vérifier les migrations Prisma
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: safebase_user
          POSTGRES_PASSWORD: safebase_password
          POSTGRES_DB: safebase_db
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://safebase_user:safebase_password@localhost:5432/safebase_db
      SHADOW_DATABASE_URL: postgresql://safebase_user:safebase_password@localhost:5432/safebase_shadow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # tsx et vitest ignorent les types : sans cette étape, une erreur de type passe la CI.
      # Lance aussi "prisma generate", qui refuse un schema.prisma invalide.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Appliquer les migrations sur une base vide
        run: npx prisma migrate deploy

      # Échoue (code 2) si schema.prisma a été modifié sans créer de migration
      - name: Schéma et migrations synchronisés
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE safebase_shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  worker-go:
    name: worker-go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Même version de Go que celle déclarée dans go.mod (pas de go.sum : rien à mettre en cache)
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: worker-go/go.mod
          cache: false

      - run: go vet ./...

      # go test compile déjà le paquet : pas besoin d'un go build séparé
      - run: go test ./...

      # Ne signale que les failles réellement atteintes par le code (bibliothèque standard comprise)
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Le test qui compte le plus : une vraie sauvegarde (pg_dump) suivie d'une vraie restauration (psql)
  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: client_user
          POSTGRES_PASSWORD: client_password
          POSTGRES_DB: client_db
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: worker-go/go.mod
          cache: false

      # Le runner fournit un client Postgres plus récent (16 ou 18) : on installe la version 15,
      # la même que dans l'image du worker et que les bases
      - name: Installer le client PostgreSQL 15
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-15
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"

      - name: Vérifier la version de pg_dump
        run: pg_dump --version | grep -q ' 15\.' || { pg_dump --version; exit 1; }

      - name: Sauvegarde puis restauration
        working-directory: worker-go
        run: go test -tags=integration -run Integration -v ./...
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: client_user
          PGPASSWORD: client_password
          PGDATABASE: client_db

  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # Détecte les erreurs de syntaxe et les imports cassés
      - run: npm run build

  # CD : construit les 3 images une fois toutes les vérifications passées.
  # Si un seul test échoue, ce job ne démarre pas : rien n'est construit ni publié.
  # | Déclencheur   | Étape du Dockerfile | Tags publiés                    |
  # | PR            | prod                | aucun (construction seule)      |
  # | push sur main | dev                 | dev, dev-<sha>                  |
  # | tag v1.2.3    | prod                | 1.2.3, latest                   |
  docker-images:
    name: docker-images (${{ matrix.service }})
    needs: [ server, worker-go, integration, client ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ server, worker-go, client ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          # "latest" n'est jamais ajouté automatiquement : il désigne uniquement la dernière version de prod
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha,prefix=dev-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          # Branche main → image de développement ; tag (et PR, pour vérifier le Dockerfile de prod) → production
          target: ${{ github.ref == 'refs/heads/main' && 'dev' || 'prod' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Utilisé seulement par le client : URL de l'API vue par le navigateur (variable du dépôt)
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Notification Google Chat à chaque exécution, succès comme échec (if: always()).
  # Contient le commit, son auteur, le statut et, en cas d'échec, les jobs/étapes en échec avec un extrait des logs.
  # Le webhook est le secret GOOGLE_CHAT_WEBHOOK (Settings > Secrets and variables > Actions).
  notify:
    name: notify
    needs: [ server, worker-go, integration, client, docker-images ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read # lire les jobs et les logs de ce run pour expliquer l'échec
    steps:
      - name: Envoyer la notification Google Chat
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          AUTHOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Les PR de Dependabot n'ont pas accès aux secrets : on prévient sans faire échouer le run
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Secret GOOGLE_CHAT_WEBHOOK absent : notification non envoyée"
            exit 0
          fi

          case "$STATUS" in
            success)   status="✅ Succès" ;;
            failure)   status="❌ Échec" ;;
            *)         status="⚠️ Annulé" ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            trigger="PR #$PR_NUMBER"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            trigger="tag $GITHUB_REF_NAME (production)"
          else
            trigger="push sur $GITHUB_REF_NAME (développement)"
          fi

          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          text="*SafeBase CI/CD : $status*
          *Déclencheur :* $trigger
          *Commit :* <$repo_url/commit/$SHA|${SHA:0:7}> par $AUTHOR
          *Message :* $(echo "$COMMIT_MESSAGE" | head -n 1)
          *Détails :* <$repo_url/actions/runs/$GITHUB_RUN_ID|ouvrir le run>"

          # En cas d'échec : pour chaque job en échec, l'étape fautive et les lignes d'erreur de ses logs.
          # "|| true" : GitHub lance ce script avec "bash -e -o pipefail" ; sans lui, un grep sans résultat
          # arrêterait le script et la notification ne partirait pas.
          if [ "$STATUS" = "failure" ]; then
            text="$text

          *Raison de l'échec :*"
            failed_jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)\t\([.steps[] | select(.conclusion == "failure") | .name] | join(", "))"' || true)
            while IFS=$'\t' read -r job_id job_name step_name; do
              [ -z "$job_id" ] && continue
              # Retire les codes couleur et l'horodatage de chaque ligne, garde les lignes d'erreur (sinon la fin du log)
              logs=$(gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" \
                | perl -pe 's/\e\[[0-9;]*[A-Za-z]//g; s/^[0-9T:.-]+Z //' || true)
              errors=$(echo "$logs" | grep -iE '##\[error\]|error|fail|panic' | grep -v '^##\[group\]' | tail -n 12 || true)
              [ -z "$errors" ] && errors=$(echo "$logs" | tail -n 12)
              text="$text
          • *$job_name* — étape « $step_name »
          \`\`\`$(echo "$errors" | cut -c1-200)\`\`\`"
            done <<< "$failed_jobs"
          fi

          # jq construit un JSON valide quel que soit le texte (guillemets, retours à la ligne...)
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json; charset=UTF-8' -d @- "$WEBHOOK" > /dev/null
          echo "Notification envoyée ($STATUS)"
